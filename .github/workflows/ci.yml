name: CI - Tests and Linters

on:
  push:
    branches:
      - main
      - develop
      - 'claude/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install CMS dependencies
        run: cd cms && bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Check formatting
        run: bun run format

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install CMS dependencies
        run: cd cms && bun install --frozen-lockfile

      - name: Run Astro type check
        run: bun run check

      - name: Generate Payload types
        run: cd cms && bun run generate:types

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Astro frontend
        run: bun run build
        env:
          PAYLOAD_URL: http://localhost:3001
          PUBLIC_SITE_URL: http://localhost:4321

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  build-cms:
    name: Build CMS
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: cd cms && bun install --frozen-lockfile

      - name: Generate Payload types
        run: cd cms && bun run generate:types

      - name: Build CMS
        run: cd cms && bun run build
        env:
          DATABASE_URI: postgresql://localhost/test
          PAYLOAD_SECRET: test-secret
          PAYLOAD_URL: http://localhost:3001
          PUBLIC_SITE_URL: http://localhost:4321

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cms-build
          path: cms/build/
          retention-days: 7

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [build-cms]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./cms
          push: false
          tags: ep-133-cms:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Lint Helm chart
        run: helm lint helm/ep-133-cms

      - name: Template Helm chart
        run: |
          helm template test-release helm/ep-133-cms \
            --set env.DATABASE_URI=postgresql://test \
            --set env.PAYLOAD_SECRET=test \
            --set env.ADMIN_EMAIL=test@example.com \
            --set env.ADMIN_PASSWORD=test
